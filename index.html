<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline icon: no request for a separate file. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c3aed'/><path d='M8 24V8M8 24h16' stroke='white' stroke-width='2.5' stroke-linecap='round' fill='none'/><ellipse cx='15' cy='18' rx='4' ry='3' fill='%23c4b5fd'/><ellipse cx='21' cy='12' rx='3.5' ry='2.5' fill='white'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashby Plot Builder</title>
    <script>
      (() => {
        const storedTheme = localStorage.getItem('ashby-ui-theme')
        const preference = storedTheme === 'light' || storedTheme === 'dark' || storedTheme === 'system' ? storedTheme : 'system'
        const theme = preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : preference === 'dark' ? 'dark' : 'light'
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
